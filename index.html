<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYER PORTAL // WEB DEV QUEST</title>
  <!-- Google Fonts: Orbitron (科技電競字體) & Press Start 2P -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #08090d;
      --card-bg: rgba(16, 20, 31, 0.75);
      --card-locked: rgba(18, 20, 26, 0.6);
      --cyan: #00f3ff;
      --pink: #ff0055;
      --purple: #9d00ff;
      --gold: #ffbe00;
      --green: #00ff66;
      --dark-gray: #1a1d26;
      --locked-gray: #3a3f52;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
      --font-cyber: 'Orbitron', 'Noto Sans TC', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-cyber);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1rem 4rem;
      overflow-x: hidden;
      position: relative;
    }

    .bg-grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(to right, rgba(0, 243, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      z-index: -2;
      pointer-events: none;
    }

    .bg-glow {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 243, 255, 0.15) 0%, rgba(255, 0, 85, 0.08) 40%, transparent 70%);
      z-index: -1;
      pointer-events: none;
      filter: blur(50px);
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { opacity: 0.6; transform: translate(-50%, -50%) scale(0.9); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }

    .container {
      max-width: 1200px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 1;
    }

    /* Header Profile Section */
    .profile-card {
      background: var(--card-bg);
      border: 1px solid rgba(0, 243, 255, 0.3);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2.5rem 2rem 2rem;
      width: 100%;
      max-width: 700px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      margin-bottom: 2.5rem;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.15), inset 0 0 15px rgba(0, 243, 255, 0.05);
      clip-path: polygon(0 0, 95% 0, 100% 5%, 100% 100%, 5% 100%, 0 95%);
    }

    /* HUD Tech Corners */
    .profile-card::before, .profile-card::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-color: var(--cyan);
      border-style: solid;
      pointer-events: none;
    }

    .profile-card::before {
      top: 6px;
      left: 6px;
      border-width: 2px 0 0 2px;
    }

    .profile-card::after {
      bottom: 6px;
      right: 6px;
      border-width: 0 2px 2px 0;
    }

    .avatar-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin-bottom: 1.2rem;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      position: relative;
      z-index: 2;
      border: 2px solid var(--cyan);
      background: #000;
      transition: transform 0.4s ease, border-color 0.4s ease;
    }

    .avatar-ring {
      position: absolute;
      top: -8px;
      left: -8px;
      right: -8px;
      bottom: -8px;
      border-radius: 50%;
      border: 2px dashed var(--pink);
      animation: spinRing 12s linear infinite;
      z-index: 1;
      opacity: 0.8;
    }

    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    .avatar-wrapper:hover .avatar-img {
      transform: scale(1.08) rotate(-3deg);
      border-color: var(--pink);
      box-shadow: 0 0 25px var(--pink);
    }

    .avatar-wrapper:hover .avatar-ring {
      animation-duration: 4s;
      border-color: var(--cyan);
    }

    .player-tag {
      font-size: 0.85rem;
      color: var(--cyan);
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .player-tag::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }

    .player-name {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
      position: relative;
      text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.4);
      margin-bottom: 1rem;
    }

    .stats-bar {
      width: 100%;
      max-width: 450px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stats-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .stats-level {
      color: var(--gold);
    }

    .stats-exp {
      color: var(--cyan);
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      width: 18.75%; /* 3/16 = 18.75% */
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--pink));
      box-shadow: 0 0 10px var(--cyan);
      border-radius: 4px;
      position: relative;
      transition: width 1s ease-in-out;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
      animation: shine 2s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 15px;
      color: var(--text-main);
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), transparent);
    }

    /* 16 Grid System */
    .quest-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      width: 100%;
    }

    /* Responsive Grid Breakpoints */
    @media (max-width: 1024px) {
      .quest-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .quest-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .player-name {
        font-size: 1.75rem;
      }
    }

    @media (max-width: 480px) {
      .quest-grid {
        grid-template-columns: 1fr;
      }
      .profile-card {
        padding: 2rem 1rem 1.5rem;
      }
    }

    .quest-card {
      position: relative;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.25rem 1rem;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-main);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* Top Badge in Card */
    .quest-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .quest-week {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
    }

    .quest-status {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
    }

    .quest-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-top: 0.8rem;
      line-height: 1.4;
      font-family: 'Noto Sans TC', var(--font-cyber);
    }

    .quest-card.unlocked {
      border-color: rgba(0, 243, 255, 0.4);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      background: linear-gradient(135deg, rgba(16, 26, 43, 0.9), rgba(10, 15, 26, 0.9));
      cursor: pointer;
    }

    .quest-card.unlocked .quest-week {
      background: rgba(0, 243, 255, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(0, 243, 255, 0.4);
    }
