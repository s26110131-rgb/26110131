<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>電競風留言板</title>
  
  <!-- 載入 Google Fonts (Orbitron 科技感字體 & Noto Sans TC) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Orbitron:wght@600;900&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       1. 全局變數設定 (控制顏色與視覺風格)
       ========================================================= */
    :root {
      /* 背景與基礎色彩 */
      --bg-color: #0d0f17;          /* 主背景：極暗藍黑色 */
      --card-bg: rgba(20, 24, 38, 0.85); /* 卡片背景：半透明深藍 */
      --text-color: #e2e8f0;       /* 主要文字顏色 */
      --text-muted: #94a3b8;      /* 次要/時間文字顏色 */

      /* 電競霓虹主題色 */
      --neon-cyan: #00f0ff;        /* 電競青/螢光藍 */
      --neon-pink: #ff007f;        /* 電競粉紅/霓虹紅 */
      --neon-purple: #7000ff;      /* 電競紫 */
      
      /* 【控制顏色與輪播高亮樣式】 */
      --highlight-scale: 1.05;     /* 輪播高亮時卡片放大的倍率 */
      --highlight-glow: 0 0 25px var(--neon-cyan), 0 0 10px var(--neon-pink); /* 高亮發光特效 */
    }

    /* =========================================================
       2. 基礎樣式與暗黑電競背景
       ========================================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
      /* 電競背景：科技網格 + 漸層光圈 */
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(112, 0, 255, 0.25), transparent 70%),
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .title {
      font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #fff;
      /* 主標題霓虹發光字體 */
      text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-purple);
    }

    .subtitle {
      margin-top: 0.5rem;
      color: var(--text-muted);
      font-size: 0.95rem;
      letter-spacing: 1px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* =========================================================
       3. 載入中動畫 (Loading Animation)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 0;
      text-align: center;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(0, 240, 255, 0.1);
      border-left-color: var(--neon-cyan);
      border-right-color: var(--neon-pink);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    .loading-text {
      margin-top: 1.5rem;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      color: var(--neon-cyan);
      letter-spacing: 2px;
      text-shadow: 0 0 8px var(--neon-cyan);
      animation: pulse 1.5s ease-in-out infinite alternate;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* =========================================================
       4. 瀑布流卡片牆 (Masonry Layout)
       ========================================================= */
    .masonry-wall {
      column-count: 1;
      column-gap: 1.5rem;
    }

    @media (min-width: 640px) {
      .masonry-wall { column-count: 2; }
    }
    @media (min-width: 1024px) {
      .masonry-wall { column-count: 3; }
    }

    /* =========================================================
       5. 卡片樣式與動態高亮/變暗特效
       ========================================================= */
    .card {
      break-inside: avoid;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 12px;
      padding: 1.25rem;
      backdrop-filter: blur(8px);
      position: relative;
      overflow: hidden;
      
      /* 平滑輪播漸變切換 */
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1),
                  filter 0.6s ease,
                  border-color 0.6s ease,
                  box-shadow 0.6s ease,
                  opacity 0.6s ease;
    }

    /* 卡片左側電競線條 */
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(to bottom, var(--neon-cyan), var(--neon-purple));
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .card-author {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-author::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background-color: var(--neon-cyan);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--neon-cyan);
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: 'Orbitron', monospace;
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ---------------------------------------------------------
       【輪播焦點樣式】未選中卡片變暗，選中卡片放大發光
       --------------------------------------------------------- */
    /* 輪播開始後，未被高亮的卡片稍微變暗、模糊與縮小 */
    .masonry-wall.has-highlight .card {
      opacity: 0.4;
      filter: blur(1.5px) grayscale(40%);
      transform: scale(0.98);
    }

    /* 被選中的高亮卡片 */
    .masonry-wall.has-highlight .card.highlight {
      opacity: 1;
      filter: blur(0px) grayscale(0%);
      transform: scale(var(--highlight-scale));
      z-index: 10;
      border-color: var(--neon-cyan);
      box-shadow: var(--highlight-glow);
    }

    .masonry-wall.has-highlight .card.highlight::before {
      background: linear-gradient(to bottom, var(--neon-cyan), var(--neon-pink));
      box-shadow: 0 0 10px var(--neon-cyan);
    }
  </style>
</head>
<body>

  <!-- 標題區 -->
  <header>
    <h1 class="title">PLAYER MESSAGES</h1>
    <p class="subtitle">// 朋友對我的動態悄悄話牆 //</p>
  </header>

  <!-- 留言牆容器 -->
  <div class="container">
    <!-- 載入中與錯誤提示動畫 -->
    <div id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loading-status">LOADING MESSAGES...</div>
    </div>

    <!-- 動態卡片瀑布流牆 -->
    <div id="wall" class="masonry-wall"></div>
  </div>

  <script>
    /* =========================================================
       6. 參數設定 (可在此修改 CSV 網址與輪播時間)
       ========================================================= */
    const CONFIG = {
      // Google 試算表發佈到網路的 CSV 網址
      csvUrl: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRbPqZ-ZvNuVkkZnxJIJm0j7WGbojYfk70u85gqkBKbhEo-kWp0qmMO0zqljp4WAnEwASoP5R1yN9Ox/pub?output=csv',
      
      // 【控制輪播秒數】單位為毫秒 (ms)。 3000 代表 3 秒輪播一次
      carouselInterval: 3000 
    };

    /* =========================================================
       7. CSV 解析器 (解決留言內含逗號、引號或換行的解析問題)
       ========================================================= */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let currentToken = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuotes && nextChar === '"') {
            currentToken += '"';
            i++; 
          } else {
            insideQuotes = !insideQuotes;
          }
        } else if (char === ',' && !insideQuotes) {
          row.push(currentToken.trim());
          currentToken = '';
        } else if ((char === '\r' || char === '\n') && !insideQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(currentToken.trim());
          if (row.length > 0 && row.some(field => field !== '')) {
            lines.push(row);
          }
          row = [];
          currentToken = '';
        } else {
          currentToken += char;
        }
      }

      if (currentToken || row.length > 0) {
        row.push(currentToken.trim());
        lines.push(row);
      }

      return lines;
    }

    /* =========================================================
       8. 安全轉義與 DOM 動態渲染卡片
       ========================================================= */
    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderCards(data) {
      const wall = document.getElementById('wall');
      wall.innerHTML = '';

      // 跳過第 0 行標題列 (時間戳記, 名字, 悄悄話)
      const rows = data.slice(1);

      if (!rows || rows.length === 0) {
        wall.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 2rem;">目前沒有任何留言資料</div>';
        return;
      }

      rows.forEach((row) => {
        // 依照欄位順序取得：0=時間, 1=名字, 2=悄悄話
        const [time = '', name = '匿名玩家', message = ''] = row;

        if (!message && !name) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">${escapeHTML(name)}</span>
            <span class="card-time">${escapeHTML(time.split(' ')[0] || time)}</span>
          </div>
          <div class="card-content">${escapeHTML(message)}</div>
        `;

        wall.appendChild(card);
      });
    }

    /* =========================================================
       9. 定時器輪播高亮特效 (setInterval 3秒輪播)
       ========================================================= */
    function startHighlightCarousel() {
      const wall = document.getElementById('wall');
      const cards = wall.querySelectorAll('.card');

      if (cards.length === 0) return;

      // 啟用牆面模糊狀態
      wall.classList.add('has-highlight');

      let currentIndex = 0;
      cards[currentIndex].classList.add('highlight');

      // 每隔 3 秒切換亮起的卡片
      setInterval(() => {
        cards[currentIndex].classList.remove('highlight');
        
        // 依序循環下張卡片
        currentIndex = (currentIndex + 1) % cards.length;
        
        cards[currentIndex].classList.add('highlight');

        // 平滑滾動讓當前高亮卡片出現在可見區域
        cards[currentIndex].scrollIntoView({
          behavior: 'smooth',
          block: 'nearest'
        });
      }, CONFIG.carouselInterval);
    }

    /* =========================================================
       10. 初始化與 Fetch Google CSV 資料
       ========================================================= */
    async function init() {
      const loadingEl = document.getElementById('loading');
      const statusText = document.getElementById('loading-status');

      try {
        const response = await fetch(CONFIG.csvUrl);
        
        if (!response.ok) {
          throw new Error(`HTTP 狀態碼: ${response.status}`);
        }

        const csvText = await response.text();
        const parsedData = parseCSV(csvText);

        // 資料載入成功，隱藏 Loading 動畫
        loadingEl.style.display = 'none';

        // 生成卡片並啟動輪播
        renderCards(parsedData);
        startHighlightCarousel();

      } catch (error) {
        console.error('CSV 讀取失敗:', error);
        if (statusText) {
          statusText.style.color = 'var(--neon-pink)';
          statusText.innerHTML = `讀取失敗：${error.message}<br><small style="color:var(--text-muted);">請確保 Google 試算表已開啟「發佈到網路」為 CSV 格式。</small>`;
        }
      }
    }

    // 頁面載入後自動觸發
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
